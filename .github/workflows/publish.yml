name: "Publish: build the host image, push :latest and the release tag"
run-name: "${{ github.event_name == 'schedule' && 'Weekly rebuild' || format('Publish {0}', github.ref_name) }}"

# A release (a v* tag pushed by hand) and the weekly rebuild that brings in Fedora's security fixes both publish
# :latest, which only clocks following latest take; :stable moves only by promote.yml.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: "Image: build, push to ghcr.io (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      # The Fedora CoreOS base is about 5 GB unpacked; the runner's preinstalled toolchains make room for it.
      - name: rm -rf the runner's unused toolchains
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: actions/checkout
        uses: actions/checkout@v4

      - name: docker/login-action ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build -f Containerfile
        run: docker build -t ghcr.io/aetherbreaker/timeclock-host:latest -f Containerfile .

      - name: docker push :latest (and the release tag)
        run: |
          docker push ghcr.io/aetherbreaker/timeclock-host:latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker tag ghcr.io/aetherbreaker/timeclock-host:latest "ghcr.io/aetherbreaker/timeclock-host:$GITHUB_REF_NAME"
            docker push "ghcr.io/aetherbreaker/timeclock-host:$GITHUB_REF_NAME"
          fi

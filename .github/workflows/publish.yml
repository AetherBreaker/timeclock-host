name: "Publish: build the host image, push the release tag and :latest"
run-name: "${{ github.ref_type == 'tag' && format('Publish {0}', github.ref_name) || 'Rebuild the newest release' }}"

# A release (`poe release` pushes its vX.Y.Z tag) builds that tag. The weekly rebuild, and a run by hand, rebuild the
# newest release tag to bring in Fedora's security fixes. Both push :latest, which only clocks following latest take;
# :stable moves only by promote.yml. The image carries the release's version (HOST_VERSION), and its build date.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  image:
    name: "Image: build, push to ghcr.io (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      # The Fedora CoreOS base is about 5 GB unpacked; the runner's preinstalled toolchains make room for it.
      - name: rm -rf the runner's unused toolchains
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: actions/checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: echo RELEASE=the pushed tag
        if: github.ref_type == 'tag'
        run: echo "RELEASE=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: git checkout the newest release tag
        if: github.ref_type != 'tag'
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -n "$tag" ] || { echo "::error::no release yet (poe release): nothing to rebuild"; exit 1; }
          git checkout -q "$tag"
          echo "RELEASE=$tag" >> "$GITHUB_ENV"

      - name: docker/login-action ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker build -f Containerfile --build-arg HOST_VERSION
        run: docker build --build-arg "HOST_VERSION=${RELEASE#v}" -t ghcr.io/aetherbreaker/timeclock-host:latest -f Containerfile .

      - name: docker push :latest (and the release tag, on a release)
        run: |
          docker push ghcr.io/aetherbreaker/timeclock-host:latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker tag ghcr.io/aetherbreaker/timeclock-host:latest "ghcr.io/aetherbreaker/timeclock-host:$GITHUB_REF_NAME"
            docker push "ghcr.io/aetherbreaker/timeclock-host:$GITHUB_REF_NAME"
          fi

# Docker without SELinux labels on containers (the host stays enforcing), as Debian and Docker's own packages run it:
# Coolify's build helper writes into the host's /root/.docker, and the app bind-mounts its data folder and raw USB
# devices, none of which a labelled container may use.
[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock --userland-proxy-path /usr/bin/docker-proxy --init-path /usr/bin/tini-static

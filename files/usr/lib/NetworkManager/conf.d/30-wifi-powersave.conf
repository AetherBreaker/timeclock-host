# Wifi power saving off. With it on, the clocks' rtw88 USB dongles miss the router's beacons (main-warehouse,
# 2026-11-03: about one a minute, two disconnects, a deploy failed in a burst; off: one in 16 minutes), stalling the
# link for seconds at a time. The clocks run on mains power. A wifi profile's own powersave would override this; the
# install stick's sets none.
[connection]
wifi.powersave=2

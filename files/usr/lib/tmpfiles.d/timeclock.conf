# /data is a link to /var/data. The app's folder keeps whatever owner its container gives it ("-").
d /var/data 0755 root root -
d /var/data/timeclock_system_files 0755 - - -
d /var/data/timeclock_system_files/branding 0755 - - -
C /var/data/timeclock_system_files/branding/SFT-Logo-June-2022-color.svg - - - - /usr/share/timeclock/branding/SFT-Logo-June-2022-color.svg
d /var/data/timeclock_system_files/remote 0700 - - -

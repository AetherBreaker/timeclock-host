# /etc/timeclock/recorder.conf: the screen recorder's settings. Every key is optional; the values below are the
# defaults. A change takes effect with `systemctl restart timeclock-recorder`.

# Where clips go (raw .h264 and .frames, the .txt event log, the processed .mp4), the app's status folder (asleep and
# scan in; recording and recorder.json out), sway's control and Wayland sockets, and the clock window's app id.
#recordings_dir = /data/timeclock_system_files/recordings
#status_dir = /data/timeclock_system_files/status
#sway_socket = /run/timeclock-display/sway.sock
#wayland_socket = /run/user/0/wayland-1
#clock_app_id = local.timeclock.Clock

# A clip keeps footage from before_secs before an interaction until after_secs pass with none, and splits at
# max_clip_secs. A keyframe every keyframe_secs, so a clip can start up to that much earlier than before_secs.
#before_secs = 15
#after_secs = 15
#max_clip_secs = 600
#keyframe_secs = 2

# Frames only when the screen changes, at most max_fps a second.
#max_fps = 30

# A freeze: the app's heartbeat block unchanged for freeze_frames frames or freeze_secs seconds, whichever first.
#freeze_frames = 15
#freeze_secs = 1

# The recordings folder's cap; the oldest clips go first.
#cap_gb = 40

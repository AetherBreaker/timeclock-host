# /etc/timeclock/updater.conf: the host updater's settings. Every key is optional; the values below are the
# defaults. A change takes effect with `systemctl restart timeclock-updater`.

# The host image (a channel is a tag on it), the app's compose service (its container's HOST_UPDATE_CHANNEL,
# HOST_UPDATE_MODE and HOST_UPDATE_WINDOW choose the channel and when to update), how often it looks, how long nobody
# must have touched the screen before it restarts the clock, and how long a new host has to come up before it rolls
# back.
#host_image = ghcr.io/aetherbreaker/timeclock-host
#app_service = timeclock-system
#update_check_secs = 60
#update_idle_secs = 60
#update_health_secs = 600

# What a new host must answer to count as up: sway's control socket and the clock window's app id (it only has to
# answer), and Docker's socket. The helper image is Coolify's deploy container: no update starts while it runs.
#sway_socket = /run/timeclock-display/sway.sock
#clock_app_id = local.timeclock.Clock
#docker_socket = /var/run/docker.sock
#helper_image = coollabsio/coolify-helper

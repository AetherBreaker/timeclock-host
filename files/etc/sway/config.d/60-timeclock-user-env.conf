# Root's user services (PipeWire and the screen-sharing portals RustDesk uses) learn sway's Wayland socket, then
# timeclock-session.target brings up graphical-session.target, which the portal requires; in that order, so the portal
# never starts without the socket. D-Bus (dbus-broker) starts services through systemd, so systemd's environment is all
# they need.
exec sh -c 'systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user start timeclock-session.target'

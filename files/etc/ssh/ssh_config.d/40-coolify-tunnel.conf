# coolify-tunnel.service: give up on a connection that stalls before it's up, so the service restarts it (10 s later).
# On a clock with both a cable and Wi-Fi, the tunnel can connect over the first network up at boot and stall when the
# default route moves to the other; without this it waited for TCP to give up, about 15 minutes.
Host tunnels.sweetfiretobacco.com
  ConnectTimeout 30
